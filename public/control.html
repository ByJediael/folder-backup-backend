<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Central WhatsApp</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #262626;
      --primary: #81c784;
      --warn: #ffb74d;
      --error: #cf6679;
      --text: #ececec;
      --muted: #9e9e9e;
      --open: #66bb6a;
      --close: #ef5350;
      --qr: #42a5f5;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--surface2);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 1.2rem; color: var(--primary); }
    .meta { font-size: 0.8rem; color: var(--muted); }
    main {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
      padding: 16px 24px;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 960px) {
      main { grid-template-columns: 1fr; }
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .slot {
      background: var(--surface);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid var(--surface2);
    }
    .slot h2 { margin: 0 0 4px; font-size: 1rem; }
    .slot .sub { font-size: 0.75rem; color: var(--muted); margin-bottom: 10px; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .badge {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--surface2);
    }
    .badge.open { background: #1b3d1f; color: var(--open); }
    .badge.close { background: #3d1b1b; color: var(--close); }
    .badge.qr { background: #1b2d3d; color: var(--qr); }
    .badge.offline { color: var(--muted); }
    .badge.fcm-no { color: var(--warn); }
    input, select {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 8px;
      border: 1px solid var(--surface2);
      border-radius: 6px;
      background: var(--surface2);
      color: var(--text);
      font-size: 0.85rem;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; }
    button {
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--surface2);
      color: var(--text);
    }
    button.primary { background: #2e7d32; color: #fff; }
    button.warn { background: #e65100; color: #fff; }
    button.danger { background: #b71c1c; color: #fff; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .panel {
      background: var(--surface);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid var(--surface2);
      max-height: calc(100vh - 100px);
      overflow: auto;
    }
    .panel h3 { margin: 0 0 10px; font-size: 0.95rem; }
    .event {
      font-size: 0.75rem;
      padding: 8px 0;
      border-bottom: 1px solid var(--surface2);
    }
    .event time { color: var(--muted); display: block; }
    #auth-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    #auth-overlay.hidden { display: none; }
    .auth-card {
      background: var(--surface);
      padding: 24px;
      border-radius: 12px;
      width: min(400px, 90vw);
    }
    #qr-modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      flex-direction: column;
      padding: 20px;
    }
    #qr-modal.show { display: flex; }
    #qr-modal img {
      max-width: min(320px, 90vw);
      background: #fff;
      padding: 12px;
      border-radius: 8px;
    }
    .msg { font-size: 0.8rem; color: var(--muted); margin-top: 8px; min-height: 2em; }
    .tabs {
      display: flex;
      gap: 4px;
      padding: 0 24px 0;
      border-bottom: 1px solid var(--surface2);
      max-width: 1400px;
      margin: 0 auto;
    }
    .tab {
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .table-wrap {
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--surface2);
      overflow: auto;
    }
    table.data {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    table.data th, table.data td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--surface2);
    }
    table.data th { color: var(--muted); font-weight: 600; }
    table.data tr:last-child td { border-bottom: none; }
    .slot.connected { border-color: #2e7d32; }
    .slot .hint { font-size: 0.72rem; color: var(--muted); margin: 0 0 10px; }
    details.advanced { margin-top: 10px; font-size: 0.8rem; }
    details.advanced summary { cursor: pointer; color: var(--muted); margin-bottom: 8px; }
  </style>
</head>
<body>
  <div id="auth-overlay">
    <div class="auth-card">
      <h2>Token da API</h2>
      <p class="meta">Mesmo Bearer do backend e dos APKs</p>
      <input id="token-input" type="password" placeholder="BACKUP_API_TOKEN" />
      <button class="primary" style="width:100%;margin-top:8px" onclick="saveToken()">Entrar</button>
    </div>
  </div>

  <header>
    <div>
      <h1>Central WhatsApp</h1>
      <div class="meta" id="header-meta">—</div>
    </div>
    <a href="/mount" style="color:var(--primary);font-size:0.85rem;text-decoration:none">Montagem</a>
    <button onclick="refresh()">Atualizar</button>
    <button onclick="logout()">Sair</button>
  </header>

  <nav class="tabs">
    <button type="button" class="tab active" data-tab="operacao" onclick="switchTab('operacao')">Operação</button>
    <button type="button" class="tab" data-tab="celulares" onclick="switchTab('celulares')">Celulares (APK)</button>
    <button type="button" class="tab" data-tab="evolution" onclick="switchTab('evolution')">Evolution</button>
    <button type="button" class="tab" data-tab="sessoes" onclick="switchTab('sessoes')">Backups (celular)</button>
  </nav>

  <main>
    <div style="grid-column: 1 / -1">
      <div id="panel-operacao" class="tab-panel active">
        <p class="hint" id="operacao-hint" style="padding:0 0 12px;margin:0;color:var(--muted);font-size:0.85rem">
          Só aparecem celulares com APK aberto e FCM registrado (Salvar no app).
        </p>
        <div class="grid" id="operacao-grid"></div>
      </div>
      <div id="panel-celulares" class="tab-panel">
        <div class="table-wrap" id="devices-table"></div>
      </div>
      <div id="panel-evolution" class="tab-panel">
        <div class="table-wrap" id="evolution-table"></div>
      </div>
      <div id="panel-sessoes" class="tab-panel">
        <div class="table-wrap" id="sessions-table"></div>
      </div>
    </div>
    <div class="panel">
      <h3>Eventos recentes</h3>
      <div id="events-list"></div>
    </div>
  </main>

  <div id="qr-modal">
    <h2 id="qr-title">QR Evolution</h2>
    <img id="qr-img" alt="QR Code" />
    <p class="meta" id="qr-hint">Escaneie com o WhatsApp do celular deste slot</p>
    <div class="actions">
      <button onclick="refreshQr()">Atualizar QR</button>
      <button onclick="closeQr()">Fechar</button>
    </div>
  </div>

  <script>
    const API_BASE = (() => {
      const origin = window.location.origin;
      const path = window.location.pathname || "";
      if (path.includes("/webhook")) return origin + "/webhook/api/v1";
      return origin + "/api/v1";
    })();
    let pollTimer = null;
    let qrInstance = null;
    let activeTab = "operacao";

    function switchTab(name) {
      activeTab = name;
      document.querySelectorAll(".tab").forEach((t) => {
        t.classList.toggle("active", t.dataset.tab === name);
      });
      document.querySelectorAll(".tab-panel").forEach((p) => {
        p.classList.toggle("active", p.id === "panel-" + name);
      });
    }

    function fmtTime(iso) {
      if (!iso) return "—";
      try {
        return new Date(iso).toLocaleString("pt-BR");
      } catch {
        return iso;
      }
    }

    function evoStateBadge(state) {
      const s = (state || "unknown").toLowerCase();
      if (s === "open") return '<span class="badge open">conectado</span>';
      if (s === "close") return '<span class="badge close">desconectado</span>';
      if (s === "qr") return '<span class="badge qr">aguardando QR</span>';
      return '<span class="badge offline">' + esc(state) + '</span>';
    }

    function renderEvolution(data) {
      const el = document.getElementById("evolution-table");
      if (!data.enabled) {
        el.innerHTML = '<p class="empty">Evolution desativado — configure EVOLUTION_BASE_URL e EVOLUTION_API_KEY no back_apk e Implante.</p>';
        return;
      }
      const instances = data.instances || [];
      if (!instances.length) {
        el.innerHTML = '<p class="empty">Nenhuma instância no Evolution — crie em evolution.jediael.uk ou use Cadastrar/Pair na montagem.</p>';
        return;
      }
      el.innerHTML = `
        <table class="data">
          <thead>
            <tr>
              <th>Instância</th>
              <th>Estado</th>
              <th>Número / owner</th>
              <th>Slot / celular</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            ${instances.map((i) => `
              <tr>
                <td><strong>${esc(i.instance)}</strong></td>
                <td>${evoStateBadge(i.state)}</td>
                <td>${esc(i.owner || i.phone_e164 || "—")}</td>
                <td>${esc(i.slot_label || i.device_id || "—")}</td>
                <td class="actions">
                  <button onclick="showQr('${esc(i.instance)}')">QR</button>
                  <button onclick="refreshEvoState('${esc(i.instance)}')">Estado</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>`;
    }

    function renderDevices(devices) {
      const el = document.getElementById("devices-table");
      if (!devices.length) {
        el.innerHTML = '<p class="empty">Nenhum celular conectado — abra o APK, configure URL/token e toque Salvar.</p>';
        return;
      }
      el.innerHTML = `
        <table class="data">
          <thead>
            <tr>
              <th>Device ID</th>
              <th>Slot</th>
              <th>FCM</th>
              <th>Sessões no celular</th>
              <th>Último sync</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${devices.map((d) => `
              <tr>
                <td><strong>${esc(d.device_id)}</strong></td>
                <td>${esc(d.slot_label || d.slot_id || "—")}</td>
                <td><span class="badge">conectado</span></td>
                <td>${d.sessions_count ?? 0}</td>
                <td>${esc(fmtTime(d.sessions_updated_at || d.fcm_updated_at))}</td>
                <td class="actions">
                  <button class="danger" onclick="removeDevice('${esc(d.device_id)}')">Remover</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>`;
    }

    function renderSessions(sessions) {
      const el = document.getElementById("sessions-table");
      if (!sessions.length) {
        el.innerHTML = '<p class="empty">Nenhum backup exportado no celular — exporte no APK ou toque Salvar para sincronizar.</p>';
        return;
      }
      el.innerHTML = `
        <table class="data">
          <thead>
            <tr>
              <th>Celular</th>
              <th>Rótulo</th>
              <th>Pasta</th>
              <th>Arquivos</th>
              <th>user_de</th>
              <th>Exportado</th>
            </tr>
          </thead>
          <tbody>
            ${sessions.map((s) => `
              <tr>
                <td>${esc(s.device_id)}</td>
                <td><strong>${esc(s.label || "—")}</strong></td>
                <td class="meta">${esc(s.folder_name)}</td>
                <td>${s.file_count ?? "—"}</td>
                <td>${s.has_user_de ? "sim" : "não"}</td>
                <td>${esc(fmtTime(s.exported_at))}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>`;
    }

    function token() {
      return sessionStorage.getItem("backup_token") || "";
    }

    function saveToken() {
      const t = document.getElementById("token-input").value.trim();
      if (!t) return alert("Informe o token");
      sessionStorage.setItem("backup_token", t);
      document.getElementById("auth-overlay").classList.add("hidden");
      startPolling();
    }

    function logout() {
      sessionStorage.removeItem("backup_token");
      stopPolling();
      document.getElementById("auth-overlay").classList.remove("hidden");
    }

    async function api(path, options = {}) {
      const res = await fetch(API_BASE + path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token(),
          ...(options.headers || {}),
        },
      });
      const text = await res.text();
      let data;
      try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
      if (res.status === 401) {
        logout();
        throw new Error("Não autorizado");
      }
      if (!res.ok) throw new Error(data.error || data.message || "HTTP " + res.status);
      return data;
    }

    function evoBadge(status) {
      const s = (status || "unknown").toLowerCase();
      if (s === "open") return '<span class="badge open">Evolution: conectado</span>';
      if (s === "close") return '<span class="badge close">Evolution: desconectado</span>';
      if (s === "qr") return '<span class="badge qr">Evolution: aguardando QR</span>';
      return '<span class="badge offline">Evolution: ' + s + '</span>';
    }

    function phoneBadge(slot) {
      const st = (slot.phone_status || "idle").toLowerCase();
      const fcm = slot.fcm_registered
        ? '<span class="badge">FCM ok</span>'
        : '<span class="badge fcm-no">Sem FCM</span>';
      return '<span class="badge">' + st + '</span>' + fcm;
    }

    function renderOperacao(devices) {
      const grid = document.getElementById("operacao-grid");
      if (!devices.length) {
        grid.innerHTML = `
          <div class="empty" style="grid-column:1/-1">
            Nenhum celular online.<br><br>
            Abra o APK → URL/token corretos → toque <strong>Salvar</strong> → volte aqui.
          </div>`;
        return;
      }
      grid.innerHTML = devices.map((s) => `
        <div class="slot connected" data-device-id="${esc(s.device_id)}">
          <h2>${esc(s.label || s.device_id)}</h2>
          <div class="sub">${esc(s.device_id)} · APK ${esc(fmtTime(s.fcm_updated_at))}</div>
          <div class="badges">${phoneBadge(s)} ${evoBadge(s.evo_status)}</div>
          <div class="msg">${esc(s.last_message || "Pronto para comandos")}</div>
          <label class="meta">Instância Evolution</label>
          <input class="evo-instance" data-device="${esc(s.device_id)}"
            value="${esc(s.evolution_instance || "")}" placeholder="ex: wa-j5" />
          <label class="meta">Número (E.164)</label>
          <input class="phone-e164" data-device="${esc(s.device_id)}"
            value="${esc(s.phone_e164 || "")}" placeholder="5561981993760" />
          <div class="actions" style="margin-top:8px">
            <button class="primary" onclick="openWa('${esc(s.device_id)}')">Abrir WA</button>
            <button onclick="navLinkPhone('${esc(s.device_id)}')">Menu pairing</button>
            <button class="primary" onclick="pairEvolution('${esc(s.device_id)}')">Pair Evolution</button>
          </div>
          <details class="advanced">
            <summary>Mais ações (sessão / cadastro)</summary>
            <input class="session-label" data-device="${esc(s.device_id)}"
              value="${esc(s.session_label || "")}" placeholder="session_label" />
            <div class="actions">
              <button class="warn" onclick="clearWa('${esc(s.device_id)}')">Limpar</button>
              <button onclick="switchWa('${esc(s.device_id)}')">Restaurar sessão</button>
              <button onclick="registerWa('${esc(s.device_id)}')">Cadastrar</button>
              <button onclick="showQr('${esc(s.evolution_instance)}')">QR</button>
            </div>
            <input class="sms-code" data-device="${esc(s.device_id)}" placeholder="código SMS" maxlength="8" />
            <button style="width:100%;margin-top:4px" onclick="sendCode('${esc(s.device_id)}')">Enviar código SMS</button>
          </details>
          <button class="danger" style="width:100%;margin-top:10px" onclick="removeDevice('${esc(s.device_id)}')">Remover celular</button>
        </div>
      `).join("");
    }

    function renderEvents(events) {
      const el = document.getElementById("events-list");
      if (!events.length) {
        el.innerHTML = '<p class="meta">Nenhum evento</p>';
        return;
      }
      el.innerHTML = events.map((e) => `
        <div class="event">
          <time>${esc(e.at || "")}</time>
          <strong>${esc(e.event)}</strong>
          ${e.device_id ? " · " + esc(e.device_id) : ""}
          <div>${esc(e.message || "")}</div>
        </div>
      `).join("");
    }

    function esc(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
    }

    function getInput(deviceId, cls) {
      const el = document.querySelector(`.${cls}[data-device="${deviceId}"]`);
      return el ? el.value.trim() : "";
    }

    async function refresh() {
      try {
        const [dash, devicesData, sessionsData, evoData] = await Promise.all([
          api("/dashboard"),
          api("/admin/devices"),
          api("/admin/whatsapp/sessions"),
          api("/admin/evolution/overview").catch((e) => ({
            enabled: false,
            instances: [],
            error: e.message,
          })),
        ]);
        renderOperacao(dash.connected_devices || []);
        renderEvents(dash.events || []);
        renderDevices(devicesData.devices || []);
        renderSessions(sessionsData.sessions || []);
        renderEvolution(evoData);
        const online = (dash.connected_devices || []).length;
        const fcm = devicesData.total || 0;
        const evoOpen = (evoData.instances || []).filter((i) => i.state === "open").length;
        const evo = evoData.enabled ? `${evoOpen}/${evoData.instances?.length || 0} Evolution` : "Evolution off";
        document.getElementById("header-meta").textContent =
          `${online} online · ${fcm} APK · ${evo}`;
      } catch (err) {
        console.error(err);
      }
    }

    async function refreshEvoState(instance) {
      try {
        await api("/evolution/instances/" + encodeURIComponent(instance) + "/state");
        await refresh();
      } catch (e) {
        alert(e.message);
      }
    }

    async function openWa(deviceId) {
      try {
        await api("/admin/whatsapp/macro/home", {
          method: "POST",
          body: JSON.stringify({ device_id: deviceId }),
        });
        await new Promise((r) => setTimeout(r, 2000));
        await api("/admin/whatsapp/macro/open-whatsapp", {
          method: "POST",
          body: JSON.stringify({ device_id: deviceId }),
        });
        await refresh();
      } catch (e) { alert(e.message); }
    }

    async function navLinkPhone(deviceId) {
      try {
        await api("/admin/whatsapp/macro/navigate-link-phone", {
          method: "POST",
          body: JSON.stringify({ device_id: deviceId }),
        });
        await refresh();
      } catch (e) { alert(e.message); }
    }

    async function pairEvolution(deviceId) {
      const instance = getInput(deviceId, "evo-instance");
      if (!instance) return alert("Informe a instância Evolution (ex: wa-j5)");
      try {
        await api("/evolution/instances/" + encodeURIComponent(instance) + "/pair", {
          method: "POST",
          body: JSON.stringify({
            device_id: deviceId,
            request_id: "ui-pair-" + Date.now(),
          }),
        });
        await refresh();
      } catch (e) { alert(e.message); }
    }

    async function clearWa(deviceId) {
      try {
        await api("/admin/whatsapp/clear", {
          method: "POST",
          body: JSON.stringify({ device_id: deviceId }),
        });
        await refresh();
      } catch (e) { alert(e.message); }
    }

    async function switchWa(deviceId) {
      const session_label = getInput(deviceId, "session-label");
      if (!session_label) return alert("Informe session_label");
      try {
        await api("/admin/whatsapp/switch", {
          method: "POST",
          body: JSON.stringify({ device_id: deviceId, session_label, open_whatsapp: true }),
        });
        await refresh();
      } catch (e) { alert(e.message); }
    }

    let lastRegisterRequest = {};

    async function registerWa(deviceId) {
      const phone_e164 = getInput(deviceId, "phone-e164");
      const session_label = getInput(deviceId, "session-label");
      if (!phone_e164 || !session_label) return alert("Número e session_label obrigatórios");
      const request_id = "reg-" + Math.random().toString(36).slice(2, 10);
      lastRegisterRequest[deviceId] = request_id;
      try {
        await api("/admin/whatsapp/register", {
          method: "POST",
          body: JSON.stringify({
            device_id: deviceId,
            request_id,
            phone_e164,
            session_label,
            display_name: "Conta Backup",
          }),
        });
        await refresh();
      } catch (e) { alert(e.message); }
    }

    async function sendCode(deviceId) {
      const code = getInput(deviceId, "sms-code");
      const request_id = lastRegisterRequest[deviceId];
      if (!code) return alert("Informe o código");
      if (!request_id) return alert("Rode Cadastrar antes");
      try {
        await api("/admin/whatsapp/register-code", {
          method: "POST",
          body: JSON.stringify({ device_id: deviceId, request_id, code }),
        });
        await refresh();
      } catch (e) { alert(e.message); }
    }

    async function removeDevice(deviceId) {
      const ok = confirm(
        "Remover " + deviceId + "?\n\n" +
        "O celular some da Operação e não recebe mais comandos FCM.\n" +
        "Para registrar de novo: abra o APK no aparelho e toque Salvar."
      );
      if (!ok) return;
      try {
        const data = await api("/admin/devices/" + encodeURIComponent(deviceId), {
          method: "DELETE",
        });
        alert(data.message || "Celular removido.");
        await refresh();
      } catch (e) { alert(e.message); }
    }

    async function showQr(instance) {
      if (!instance) return alert("Sem evolution_instance no slot");
      qrInstance = instance;
      document.getElementById("qr-modal").classList.add("show");
      document.getElementById("qr-title").textContent = "QR — " + instance;
      await refreshQr();
    }

    function closeQr() {
      document.getElementById("qr-modal").classList.remove("show");
      qrInstance = null;
    }

    async function refreshQr() {
      if (!qrInstance) return;
      try {
        const data = await api("/evolution/instances/" + encodeURIComponent(qrInstance) + "/qr");
        const b64 = data.qr_base64;
        if (b64) {
          const src = b64.startsWith("data:") ? b64 : "data:image/png;base64," + b64;
          document.getElementById("qr-img").src = src;
          document.getElementById("qr-hint").textContent =
            "Estado: " + (data.connection_state || "?") + " — atualize se expirar";
        } else {
          document.getElementById("qr-hint").textContent =
            "Sem QR (pode já estar conectado). Estado: " + (data.connection_state || "?");
          document.getElementById("qr-img").removeAttribute("src");
        }
      } catch (e) {
        document.getElementById("qr-hint").textContent = e.message;
      }
    }

    function startPolling() {
      refresh();
      stopPolling();
      pollTimer = setInterval(refresh, 2500);
      if (qrInstance) setInterval(refreshQr, 15000);
    }

    function stopPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = null;
    }

    if (token()) {
      document.getElementById("auth-overlay").classList.add("hidden");
      startPolling();
    }
  </script>
</body>
</html>
