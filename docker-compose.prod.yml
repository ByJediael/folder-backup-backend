# Produção na VPS (EasyPanel ou docker compose manual).
# Uso: docker compose -f docker-compose.prod.yml up -d --build

services:
  backup-backend:
    build: .
    image: folder-backup-backend:latest
    container_name: folder-backup-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./firebase/serviceAccount.json:/app/firebase/serviceAccount.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
